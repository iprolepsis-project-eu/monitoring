
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  #log_level: debug
  log_level: info

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
#    metadata_slo:
#        duration_slo: 5s
#        throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s

distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:
          endpoint: "tempo:4317"
  ring:
    kvstore:
      store: inmemory


ingester:
  max_block_duration: 30m               # cut the headblock when this much time passes.

compactor:
  compaction:
    block_retention: 6h                # overall Tempo trace retention.

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
#  traces_storage:
#    path: /var/tempo/generator/traces 

storage:
  trace:
    backend: local                     # backend configuration to use
    wal:
      path: /var/tempo/wal             # where to store the wal locally
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
       processors: [service-graphs, span-metrics]
       #processors: [service-graphs, span-metrics, local-blocks] # enables metrics generator
       generate_native_histograms: both
