global:
  scrape_interval: 15s

scrape_configs:
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: promtail
    static_configs:
      - targets: ['promtail:9080']

  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        regex: 'node-exporter:9100'
        target_label: instance
        replacement: 'MonitoringServer'

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        regex: 'cadvisor:8080'
        target_label: instance
        replacement: 'MonitoringServer'

storage:
  tsdb:
    out_of_order_time_window: 10m

rule_files:
  - /etc/prometheus/alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
      - targets:
        - alertmanager:9093
