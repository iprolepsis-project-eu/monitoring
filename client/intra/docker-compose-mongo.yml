name: iprolepsis-intra-mongo

services:

# Metrics collection
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    pid: host
    command:
      - --path.rootfs=/host
    
# Metrics
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    volumes:
       - ./config/otel-collector-config-mongo.yaml:/etc/otelcol-contrib/config.yaml  
    env_file:
      - .env

# Logs
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    command: 
      - --config.file=/etc/promtail/promtail-config.yaml
      - --config.expand-env=true

# Others
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    restart: unless-stopped
    command:
      - "--mongodb.uri=mongodb://<GIVE-NAME-HERE>:<GIVE-PWD-HERE>@${HOST_PUBLIC_IP}:27017"
      - "--compatible-mode"
      - "--collect-all"