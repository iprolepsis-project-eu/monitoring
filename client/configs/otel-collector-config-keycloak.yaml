receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
      - job_name: 'node-exporter'
        scrape_interval: 10s
        static_configs:
          - targets: ['node-exporter:9100']
        relabel_configs:
          - source_labels: [__address__]
            regex: 'node-exporter:9100'
            target_label: instance
            replacement: '${HOST_NAME}'
            
      - job_name: 'cadvisor'
        scrape_interval: 10s
        static_configs:
          - targets: ['cadvisor:8080']
        relabel_configs:
          - source_labels: [__address__]
            regex: 'cadvisor:8080'
            target_label: instance
            replacement: '${HOST_NAME}'
            
processors:
  batch:
    timeout: 10s
    
exporters:
  otlp:
    endpoint: ${SERVER_MONITORING_PUBLIC_IP}:4317
    tls:
      insecure: true
  
  debug:
      
extensions:
 health_check:
 pprof:
 zpages:

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [otlp]
    
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, debug]
